</head>
<body
	class="bg-background text-on-background font-body-md text-body-md flex h-screen overflow-hidden antialiased">
	<!-- SideNavBar -->
	<aside
		class="fixed left-0 top-0 h-full w-sidebar-width z-50 bg-surface-container-high border-r border-outline-variant flex flex-col py-lg">
		<div class="px-lg mb-xl flex items-center gap-md">
			<div
				class="w-10 h-10 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
				<span class="material-symbols-outlined" data-icon="storefront">storefront</span>
			</div>
			<div>
				<h1
					class="font-headline-md text-headline-md font-bold text-on-surface">Commerce
					Admin</h1>
				<p class="font-caption text-caption text-on-surface-variant">Enterprise
					Suite</p>
			</div>
		</div>
		<nav class="flex-1 px-sm space-y-base overflow-y-auto">
			<a
				class="flex items-center gap-md text-on-surface-variant px-md py-sm hover:bg-surface-container-highest transition-all rounded-lg scale-98 active:scale-95 duration-200"
				href="#"> <span class="material-symbols-outlined"
				data-icon="dashboard">dashboard</span> <span
				class="font-title-md text-title-md">Dashboard</span>
			</a> <a
				class="flex items-center gap-md text-on-surface-variant px-md py-sm hover:bg-surface-container-highest transition-all rounded-lg scale-98 active:scale-95 duration-200"
				href="#"> <span class="material-symbols-outlined"
				data-icon="inventory_2">inventory_2</span> <span
				class="font-title-md text-title-md">Product</span>
			</a>
			<!-- Active Tab -->
			<a
				class="flex items-center gap-md bg-secondary-container text-on-secondary-container rounded-lg px-md py-sm border-l-4 border-primary scale-98 active:scale-95 duration-200"
				href="#"> <span class="material-symbols-outlined"
				data-icon="category">category</span> <span
				class="font-title-md text-title-md">Category</span>
			</a> <a
				class="flex items-center gap-md text-on-surface-variant px-md py-sm hover:bg-surface-container-highest transition-all rounded-lg scale-98 active:scale-95 duration-200"
				href="#"> <span class="material-symbols-outlined"
				data-icon="shopping_cart">shopping_cart</span> <span
				class="font-title-md text-title-md">Order</span>
			</a> <a
				class="flex items-center gap-md text-on-surface-variant px-md py-sm hover:bg-surface-container-highest transition-all rounded-lg scale-98 active:scale-95 duration-200"
				href="#"> <span class="material-symbols-outlined"
				data-icon="group">group</span> <span
				class="font-title-md text-title-md">User</span>
			</a>

		</nav>
		<div class="px-sm mt-auto">
			<div class="h-px bg-outline-variant mx-md mb-sm"></div>
			<a
				class="flex items-center gap-md text-on-surface-variant px-md py-sm hover:bg-surface-container-highest transition-all rounded-lg scale-98 active:scale-95 duration-200"
				href="#"><span class="material-symbols-outlined"
				data-icon="settings">settings</span><span
				class="font-title-md text-title-md">Settings</span></a>
		</div>
	</aside>
	<!-- Main Content Wrapper -->
	<div class="flex-1 ml-sidebar-width flex flex-col h-screen relative">
		<!-- TopNavBar -->
		<header
			class="w-full h-16 sticky top-0 z-40 bg-surface-container-lowest border-b border-outline-variant shadow-sm flex justify-between items-center px-lg">
			<!-- Search -->
			<div class="flex-1 max-w-md">
				<div class="relative flex items-center">
					<span
						class="material-symbols-outlined absolute left-md text-outline"
						data-icon="search">search</span> <input
						class="w-full bg-surface pl-2xl pr-md py-sm rounded-full border border-outline-variant focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-md text-body-md text-on-surface transition-all"
						placeholder="Tìm kiếm..." type="text">
				</div>
			</div>
			<!-- Actions & Profile -->
			<div class="flex items-center gap-md">
				<button
					class="p-sm text-on-surface-variant hover:bg-surface-container transition-colors rounded-full cursor-pointer active:opacity-80">
					<span class="material-symbols-outlined" data-icon="help">help</span>
				</button>
				<button
					class="p-sm text-on-surface-variant hover:bg-surface-container transition-colors rounded-full cursor-pointer active:opacity-80 relative">
					<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
					<span
						class="absolute top-sm right-sm w-2 h-2 bg-error rounded-full"></span>
				</button>
				<div class="h-8 w-px bg-outline-variant mx-sm"></div>
				<button
					class="flex items-center gap-sm cursor-pointer active:opacity-80 hover:bg-surface-container p-sm rounded-lg transition-colors">
					<img alt="User avatar"
						class="w-8 h-8 rounded-full object-cover border border-outline-variant"
						data-alt="A small, professional headshot of an administrative user, suitable for a dashboard profile avatar. Clear lighting, neutral background, modern corporate style."
						src="https://lh3.googleusercontent.com/aida-public/AB6AXuDYaOMS8YV0Dn38lHDAMVs7L8AHtsXG3pD_q1K077UF0_RKPt5ReGXDY6SWZt592HYLgrjDB6iqjPMp1R1LR3cNCTzmDkvIZZoPJ6SPZzFyd_L_udnynIPCwNY1xGdM1IlSpAICptI95cTBxkUjMFFEw0_RA6HmYYb2mTgJ4OOoZ91xroS-jIta8eATX7ySYHMwezqQTJKuVgeKT4rO7ia2OWT-AezFN2FHkKZgE9YB_YnpIWivCAc1">
					<span
						class="font-title-md text-title-md text-on-surface hidden md:block">Admin
						User</span> <span
						class="material-symbols-outlined text-on-surface-variant"
						data-icon="arrow_drop_down">arrow_drop_down</span>
				</button>
			</div>
		</header>
		<!-- Main Canvas -->
		<main class="flex-1 overflow-y-auto p-lg bg-background">
			<!-- Page Header -->
			<div class="flex items-center justify-between mb-xl">
				<div>
					<h2 class="font-headline-lg text-headline-lg text-on-surface">Thêm
						Danh Mục Mới</h2>
					<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Tạo
						danh mục sản phẩm mới cho hệ thống cửa hàng.</p>
				</div>
				<a th:href="@{/admin/category}"
					class="flex items-center gap-sm text-on-surface-variant hover:text-primary transition-colors font-title-md text-title-md px-md py-sm rounded-lg hover:bg-surface-container">

					<span class="material-symbols-outlined"> arrow_back </span> Quay
					lại danh sách

				</a>
			</div>
			<!-- Form Card -->
			<div
				class="max-w-3xl bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-xl">

				<form th:action="@{/admin/category/save}" th:object="${categoryDto}"
					method="post" enctype="multipart/form-data" class="space-y-xl">

					<!-- Hình đại diện -->
					<!-- Hình đại diện -->
					<div class="space-y-sm">

						<label class="block font-title-md text-title-md text-on-surface">
							Hình đại diện </label> <label for="imageFile"
							class="w-full bg-surface border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm cursor-pointer hover:bg-surface-container transition-all group">

							<!-- Ảnh xem trước --> <img id="preview"
							class="hidden w-40 h-40 object-cover rounded-lg border border-outline-variant mb-sm">

							<!-- Icon upload --> <span id="uploadIcon"
							class="material-symbols-outlined text-outline text-5xl group-hover:text-primary transition-colors">
								add_photo_alternate </span>

							<div id="uploadText" class="text-center">
								<p class="font-body-md text-body-md text-on-surface">Nhấp để
									tải lên hoặc kéo thả hình ảnh vào đây</p>

								<p class="font-caption text-caption text-outline mt-xs">
									PNG, JPG hoặc GIF (Tối đa 2MB)</p>
							</div> <input type="file" id="imageFile" name="avatarFile"
							class="hidden" accept="image/*">

						</label>

					</div>

					<!-- Tên danh mục -->
					<div class="space-y-sm">

						<label for="name"
							class="block font-title-md text-title-md text-on-surface">
							Tên danh mục <span class="text-error">*</span>
						</label> <input type="text" id="name" th:field="*{name}"
							placeholder="Nhập tên danh mục..."
							class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline">

						<p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
							class="text-error text-sm"></p>

					</div>


					<!-- Danh mục cha -->
					<div class="space-y-sm">

						<label for="categoryId"
							class="block font-title-md text-title-md text-on-surface">
							Danh mục cha </label> <select id="categoryId" th:field="*{categoryId}"
							class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all">

							<option value="">-- Không có danh mục cha --</option>

							<option th:each="category : ${categories}"
								th:value="${category.id}" th:text="${category.name}"></option>

						</select>

					</div>


					<!-- Mô tả -->
					<div class="space-y-sm">

						<label for="description"
							class="block font-title-md text-title-md text-on-surface">
							Mô tả </label>

						<textarea id="description" th:field="*{description}"
							placeholder="Nhập mô tả cho danh mục này..." rows="4"
							class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline resize-y"></textarea>

						<!-- Hiển thị lỗi -->
						<p th:if="${#fields.hasErrors('description')}"
							th:errors="*{description}" class="text-error text-sm"></p>

					</div>


					<!-- Trạng thái -->
					<div class="space-y-md">

						<label class="block font-title-md text-title-md text-on-surface">
							Trạng thái </label>

						<div class="flex items-center gap-xl">

							<!-- Hoạt động -->
							<label class="flex items-center gap-sm cursor-pointer group">

								<div class="relative flex items-center justify-center w-5 h-5">

									<input type="radio" th:field="*{status}" value="true"
										class="peer sr-only">

									<div
										class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary transition-colors">
									</div>

									<div
										class="absolute w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity">
									</div>

								</div> <span
								class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">
									Hoạt động </span>

							</label>


							<!-- Tạm khóa -->
							<label class="flex items-center gap-sm cursor-pointer group">

								<div class="relative flex items-center justify-center w-5 h-5">

									<input type="radio" th:field="*{status}" value="false"
										class="peer sr-only">

									<div
										class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary transition-colors">
									</div>

									<div
										class="absolute w-2.5 h-2.5 rounded-full bg-primary opacity-0 peer-checked:opacity-100 transition-opacity">
									</div>

								</div> <span
								class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">
									Tạm khóa </span>

							</label>

						</div>

					</div>


					<!-- Line -->
					<div class="h-px w-full bg-outline-variant my-lg"></div>


					<!-- Buttons -->
					<div class="flex items-center justify-end gap-md">

						<!-- Làm mới -->
						<button type="reset"
							class="px-xl py-sm rounded-lg border border-primary text-primary font-title-md text-title-md hover:bg-surface-container transition-all focus:outline-none focus:ring-2 focus:ring-primary/50 active:scale-98">
							Làm mới</button>


						<!-- Lưu -->
						<button type="submit"
							class="px-xl py-sm rounded-lg bg-primary text-on-primary font-title-md text-title-md hover:bg-primary/90 transition-all shadow-sm focus:outline-none focus:ring-2 focus:ring-primary/50 active:scale-98">
							Lưu danh mục</button>

					</div>

				</form>

			</div>
		</main>
	</div>

	<script>
		document
				.addEventListener(
						"DOMContentLoaded",
						function() {

							const imageFile = document
									.getElementById("imageFile");
							const preview = document.getElementById("preview");
							const uploadIcon = document
									.getElementById("uploadIcon");
							const uploadText = document
									.getElementById("uploadText");

							imageFile
									.addEventListener(
											"change",
											function() {

												const file = this.files[0];

												if (file) {

													// Kiểm tra dung lượng tối đa 2MB
													if (file.size > 2 * 1024 * 1024) {
														alert("Ảnh không được vượt quá 2MB");
														this.value = "";
														return;
													}

													preview.src = URL
															.createObjectURL(file);
													preview.classList
															.remove("hidden");

													uploadIcon.classList
															.add("hidden");

													uploadText.innerHTML = "<p class='text-primary font-medium'>"
															+ file.name
															+ "</p>";
												}

											});

						});
	</script>


</body>


</html>
